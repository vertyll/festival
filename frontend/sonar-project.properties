sonar.projectKey=festival-frontend
sonar.projectName=festival-frontend
sonar.issue.ignore.multicriteria=apiTypeAliases
sonar.issue.ignore.multicriteria.apiTypeAliases.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.apiTypeAliases.resourceKey=**/api/types.ts
sonar.sources=apps,packages,scripts
sonar.exclusions=**/node_modules/**,**/.next/**,**/next-env.d.ts
# Next.js reads each application's proxy matcher statically, without running the module, so the matcher cannot be
# shared from a package and the two proxies are alike by necessity.
sonar.cpd.exclusions=apps/*/proxy.ts
