spring.mongodb.uri=mongodb://localhost:27017/festival

spring.security.oauth2.client.registration.page.provider=mock
spring.security.oauth2.client.registration.page.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.page.client-id=festival-page
spring.security.oauth2.client.registration.page.client-secret=local-secret
spring.security.oauth2.client.registration.page.redirect-uri=http://localhost:3000/login/oauth2/code/page
spring.security.oauth2.client.registration.admin.provider=mock
spring.security.oauth2.client.registration.admin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.admin.client-id=festival-admin
spring.security.oauth2.client.registration.admin.client-secret=local-secret
spring.security.oauth2.client.registration.admin.redirect-uri=http://127.0.0.1:3001/login/oauth2/code/admin
spring.security.oauth2.client.provider.mock.authorization-uri=http://localhost:8090/google/authorize
spring.security.oauth2.client.provider.mock.token-uri=http://localhost:8090/google/token
spring.security.oauth2.client.provider.mock.jwk-set-uri=http://localhost:8090/google/jwks
spring.security.oauth2.client.provider.mock.user-info-uri=http://localhost:8090/google/userinfo
spring.security.oauth2.client.provider.mock.user-name-attribute=sub

festival.security.secure-cookies=false
festival.security.bootstrap-admins=admin@festival.local

festival.shop.checkout-enabled=true

festival.media.endpoint=http://localhost:3900
festival.media.region=garage
festival.media.bucket=festival-media
festival.media.access-key=GK0000000000000000000000de
festival.media.secret-key=feedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeed
festival.media.public-base-url=http://festival-media.web.localhost:3902

logging.level.com.vertyll.festival=DEBUG
