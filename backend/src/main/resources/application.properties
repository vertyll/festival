spring.application.name=festival-backend
spring.profiles.default=local
spring.threads.virtual.enabled=true
spring.main.banner-mode=off

spring.session.data.redis.namespace=${application.redis.key-prefix}:session

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true

spring.servlet.multipart.max-file-size=${application.media.max-file-size}
spring.servlet.multipart.max-request-size=60MB

spring.data.mongodb.auto-index-creation=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.port=8080
server.shutdown=graceful
server.tomcat.use-relative-redirects=true
server.servlet.session.timeout=10h
server.servlet.session.cookie.name=FESTIVAL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${application.security.secure-cookies}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

application.redis.key-prefix=festival

application.keycloak.audience=festival-api

application.security.login.page.client-id=festival-page
application.security.login.page.success-path=/account
application.security.login.page.failure-path=/account?loginError=true
application.security.login.admin.client-id=festival-admin
application.security.login.admin.success-path=/
application.security.login.admin.failure-path=/?loginError=true

application.shop.currency=PLN
application.shop.initial-settings.shipping-price=15.00
application.shop.initial-settings.stock-visible=true
application.shop.initial-settings.variant-stock-visible=false

application.media.max-file-size=5MB
application.media.max-files-per-upload=10
