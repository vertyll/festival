spring.application.name=festival-backend
spring.profiles.default=local
spring.threads.virtual.enabled=true
spring.main.banner-mode=off

server.port=8080
server.shutdown=graceful
server.tomcat.use-relative-redirects=true
server.servlet.session.timeout=12h
server.servlet.session.cookie.name=FESTIVAL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${festival.security.secure-cookies}

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true

spring.servlet.multipart.max-file-size=${festival.media.max-file-size}
spring.servlet.multipart.max-request-size=60MB

spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

festival.security.login.page.client-id=festival-page
festival.security.login.page.success-path=/account
festival.security.login.page.failure-path=/account?loginError=true
festival.security.login.admin.client-id=festival-admin
festival.security.login.admin.success-path=/
festival.security.login.admin.failure-path=/?loginError=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

festival.shop.currency=PLN
festival.shop.initial-settings.shipping-price=15.00
festival.shop.initial-settings.stock-visible=true
festival.shop.initial-settings.variant-stock-visible=false

festival.media.max-file-size=5MB
festival.media.max-files-per-upload=10
