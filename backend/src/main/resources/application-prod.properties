spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.ssl.bundle=internal-ca
spring.ssl.bundle.pem.internal-ca.truststore.certificate=${INTERNAL_CA_CERT}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

festival.security.secure-cookies=true
festival.security.login.page.base-url=${FESTIVAL_PAGE_URL}
festival.security.login.page.client-secret=${KEYCLOAK_PAGE_CLIENT_SECRET}
festival.security.login.admin.base-url=${FESTIVAL_ADMIN_URL}
festival.security.login.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
festival.keycloak.realm-url=${KEYCLOAK_REALM_URL}
festival.mail.from=${MAIL_FROM}

festival.shop.checkout-enabled=${FESTIVAL_CHECKOUT_ENABLED}

festival.media.endpoint=${S3_ENDPOINT}
festival.media.region=${S3_REGION}
festival.media.bucket=${S3_BUCKET}
festival.media.access-key=${S3_ACCESS_KEY}
festival.media.secret-key=${S3_SECRET_ACCESS_KEY}
festival.media.public-base-url=${S3_PUBLIC_BASE_URL}
festival.media.ssl-bundle=internal-ca

logging.structured.format.console=ecs
