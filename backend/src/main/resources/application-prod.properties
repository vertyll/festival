spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.ssl.bundle=internal-ca
spring.ssl.bundle.pem.internal-ca.truststore.certificate=${INTERNAL_CA_CERT}

spring.security.oauth2.client.registration.page.client-id=${GOOGLE_PAGE_CLIENT_ID}
spring.security.oauth2.client.registration.page.client-secret=${GOOGLE_PAGE_CLIENT_SECRET}
spring.security.oauth2.client.registration.page.redirect-uri=${FESTIVAL_PAGE_URL}/login/oauth2/code/page
spring.security.oauth2.client.registration.admin.client-id=${GOOGLE_ADMIN_CLIENT_ID}
spring.security.oauth2.client.registration.admin.client-secret=${GOOGLE_ADMIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.admin.redirect-uri=${FESTIVAL_ADMIN_URL}/login/oauth2/code/admin

festival.security.secure-cookies=true
festival.security.bootstrap-admins=${FESTIVAL_BOOTSTRAP_ADMINS}

festival.shop.checkout-enabled=${FESTIVAL_CHECKOUT_ENABLED}

festival.media.endpoint=${S3_ENDPOINT}
festival.media.region=${S3_REGION}
festival.media.bucket=${S3_BUCKET}
festival.media.access-key=${S3_ACCESS_KEY}
festival.media.secret-key=${S3_SECRET_ACCESS_KEY}
festival.media.public-base-url=${S3_PUBLIC_BASE_URL}
festival.media.ssl-bundle=internal-ca

logging.structured.format.console=ecs
