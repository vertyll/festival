# Database (URI replaced by Testcontainers)
spring.mongodb.uri=mongodb://testcontainers-override/festival

# Google login
spring.security.oauth2.client.registration.page.client-id=test-page-client
spring.security.oauth2.client.registration.page.client-secret=test-page-secret
spring.security.oauth2.client.registration.page.redirect-uri=http://localhost:3000/login/oauth2/code/page
spring.security.oauth2.client.registration.admin.client-id=test-admin-client
spring.security.oauth2.client.registration.admin.client-secret=test-admin-secret
spring.security.oauth2.client.registration.admin.redirect-uri=http://127.0.0.1:3001/login/oauth2/code/admin

# Security
festival.security.secure-cookies=false
festival.security.bootstrap-admins=bootstrap-admin@example.com

# Shop
festival.shop.checkout-enabled=true

# Media
festival.media.endpoint=http://localhost:3900
festival.media.region=garage
festival.media.bucket=festival-media
festival.media.access-key=GKtest
festival.media.secret-key=test-secret-key-000
festival.media.public-base-url=https://media.example.com
