name: Frontend (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: Workspace application name (page or admin)
        required: true
        type: string
      image-name:
        description: Image name in the registry
        required: true
        type: string
      tag-prefix:
        description: Git tag prefix that publishes the image (e.g. page-v)
        required: true
        type: string
    secrets:
      ZOT_USERNAME:
        required: false
      ZOT_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  quality:
    name: Prettier, ESLint, TypeScript, translations, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@festival/${{ inputs.app }}..." --filter festival-frontend

      - name: Check formatting
        run: pnpm exec prettier --check apps/${{ inputs.app }} packages

      - name: Lint
        run: pnpm exec eslint --max-warnings 0 apps/${{ inputs.app }} packages

      - name: Type check
        run: pnpm turbo typecheck --filter="@festival/${{ inputs.app }}..."

      - name: Check translations
        run: pnpm run check:translations

      - name: Build
        run: pnpm turbo build --filter="@festival/${{ inputs.app }}"
        env:
          NEXT_TELEMETRY_DISABLED: 1
          BACKEND_INTERNAL_URL: http://backend:8080

  image:
    needs: quality
    if: github.event_name != 'push' || github.ref_type == 'tag'
    uses: ./.github/workflows/_image.yml
    with:
      context: frontend
      image-name: ${{ inputs.image-name }}
      tag-prefix: ${{ inputs.tag-prefix }}
      build-args: |
        APP=${{ inputs.app }}
        BACKEND_INTERNAL_URL=${{ vars.BACKEND_INTERNAL_URL || 'http://festival-backend:8080' }}
    secrets: inherit
