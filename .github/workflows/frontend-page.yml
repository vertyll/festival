name: Frontend - page

on:
  push:
    branches: [main]
    tags: ["page-v*"]
    paths:
      - "frontend/apps/page/**"
      - "frontend/packages/**"
      - "frontend/*"
      - "frontend/scripts/**"
      - "backend/src/main/resources/i18n/**"
      - "backend/src/main/java/com/vertyll/festival/common/MessageKeys.java"
      - ".github/workflows/frontend-page.yml"
      - ".github/workflows/_frontend.yml"
      - ".github/workflows/_image.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/apps/page/**"
      - "frontend/packages/**"
      - "frontend/*"
      - "frontend/scripts/**"
      - "backend/src/main/resources/i18n/**"
      - "backend/src/main/java/com/vertyll/festival/common/MessageKeys.java"
      - ".github/workflows/frontend-page.yml"
      - ".github/workflows/_frontend.yml"
      - ".github/workflows/_image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/_frontend.yml
    with:
      app: page
      image-name: vertyll/festival-page
      tag-prefix: page-v
    secrets: inherit
