name: festival

services:
  mongo:
    image: docker.io/library/mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: docker.io/dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: "dee0dee0dee0dee0dee0dee0dee0dee0dee0dee0dee0dee0dee0dee0dee0dee0"
      GARAGE_DEFAULT_ACCESS_KEY: "GK0000000000000000000000de"
      GARAGE_DEFAULT_SECRET_KEY: "feedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeed"
      GARAGE_DEFAULT_BUCKET: festival-media
    ports:
      - "127.0.0.1:3900:3900" # S3 API
      - "127.0.0.1:3902:3902" # public read
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  garage-init:
    image: docker.io/amazon/aws-cli:2.37.4
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: "GK0000000000000000000000de"
      AWS_SECRET_ACCESS_KEY: "feedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeedfeed"
      AWS_DEFAULT_REGION: garage
      S3_BUCKET: festival-media
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://garage:3900 s3api put-bucket-website --bucket "$$S3_BUCKET"
        --website-configuration '{"IndexDocument":{"Suffix":"index.html"}}'

  garage-ui:
    image: docker.io/noooste/garage-ui:v0.13.0
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_UI_GARAGE_TOML: /etc/garage.toml
      GARAGE_UI_GARAGE_ENDPOINT: http://garage:3900
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://garage:3903
    ports:
      - "127.0.0.1:3909:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:9000
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    depends_on:
      - maildev
    ports:
      - "127.0.0.1:9000:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data/h2
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  maildev:
    image: docker.io/maildev/maildev:3.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1080/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: [app]
    build:
      context: backend
    depends_on:
      mongo:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_MONGODB_URI: mongodb://mongo:27017/festival
      FESTIVAL_MEDIA_ENDPOINT: http://garage:3900
      FESTIVAL_KEYCLOAK_BACKCHANNEL_REALM_URL: http://keycloak:8080/realms/festival
    ports:
      - "127.0.0.1:8080:8080"

  page:
    profiles: [app]
    build:
      context: frontend
      args:
        APP: page
        BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  admin:
    profiles: [app]
    build:
      context: frontend
      args:
        APP: admin
        BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  mongo-data:
  garage-meta:
  garage-data:
  keycloak-data:
